[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infinihash-kyc"
version = "0.1.0"
description = "Python SDK for the Infinihash KYC API (KYC/KYB cases, sanctions screening)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Infinihash" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://kyc.infinihash.com"
"API reference" = "https://kyc-api.infinihash.com/api/v1/openapi.json"
Source = "https://github.com/Infinihash/kyc-python"

[tool.setuptools.packages.find]
include = ["infinihash_kyc*"]
